<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GardenOS — Trial 06 · First-Person Garden</title>
<style>
  html,body{margin:0;height:100%;background:#0a1410;overflow:hidden;
    font-family:-apple-system,Inter,system-ui,sans-serif;color:#eef0e8}
  canvas{display:block}
  #hud{position:fixed;left:20px;bottom:18px;z-index:10;font-size:12px;letter-spacing:.05em;
    line-height:1.55;text-shadow:0 1px 12px #000;opacity:.85;pointer-events:none}
  #season{font-size:11px;text-transform:uppercase;letter-spacing:.24em;opacity:.65}
  #title{position:fixed;right:20px;top:18px;z-index:10;text-align:right;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;opacity:.4;text-shadow:0 1px 12px #000}
  #hint{position:fixed;left:20px;top:18px;z-index:10;font-size:11px;letter-spacing:.06em;
    opacity:.3;text-shadow:0 1px 12px #000}
</style>
</head>
<body>
<div id="title">GardenOS · Trial 06<br><span style="opacity:.6">first-person garden</span></div>
<div id="hint">space · pause   ·   ↑↓ · year speed</div>
<div id="hud"><div id="season">winter</div><div>day <b id="day">0</b> / 365 · year <b id="year">1</b></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ───────────────────────────────────────────────────────────────
   GardenOS — Trial 06 · First-Person Garden
   The camera change. You stand IN the border and look OUT: layered
   depth, vegetation rising from the ground, green as the resting
   background, blooms as the seasonal colour events that come up
   through the foliage and fade. Season still drives growth + flowering
   (the ecological soul of Trial 05), now staged in perspective.
   ─────────────────────────────────────────────────────────────── */

const YEAR=365;
let day=0, year=1, speed=10, paused=false;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const FOG=new THREE.Color(0.055,0.16,0.115);          // hazy green — the "background green"
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(FOG, 8, 46);

const cam=new THREE.PerspectiveCamera(56, innerWidth/innerHeight, 0.1, 200);
cam.position.set(0,1.45,7.5); cam.lookAt(0,1.25,-14);

// fullscreen-quad scratch for post
const post=new THREE.Scene(), postCam=new THREE.Camera(), postQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),null);
post.add(postQuad);
let sceneRT=new THREE.WebGLRenderTarget(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio(),
  {type:THREE.HalfFloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});

// ── shared noise (GLSL) ───────────────────────────────────────────
const NOISE=`
  float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
  float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    float a=h21(i),b=h21(i+vec2(1,0)),c=h21(i+vec2(0,1)),d=h21(i+vec2(1,1));
    return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
  float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p*=2.0;a*=.5;}return s;}
`;

// ── SKY (gradient, fog-free) — bottom blends into the fog at horizon ─
const sky=new THREE.Mesh(new THREE.PlaneGeometry(400,160),
  new THREE.ShaderMaterial({fog:false,depthWrite:false,
    uniforms:{top:{value:new THREE.Color(0.02,0.05,0.09)},
              mid:{value:new THREE.Color(0.10,0.16,0.16)},
              hor:{value:FOG.clone()}, warm:{value:new THREE.Color(0.5,0.42,0.3)}},
    vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`precision highp float; varying vec2 vUv;
      uniform vec3 top,mid,hor,warm;
      void main(){
        float y=vUv.y;
        vec3 c=mix(hor,mid,smoothstep(0.0,0.35,y));
        c=mix(c,top,smoothstep(0.3,1.0,y));
        c+=warm*exp(-pow((y-0.04)/0.10,2.0))*0.6;       // warm glow at the horizon
        gl_FragColor=vec4(c,1.0);
      }`}));
sky.position.set(0,60,-70); scene.add(sky);

// ── GROUND — receding floor, green, fades to fog at horizon ─────────
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400,1,1),
  new THREE.ShaderMaterial({fog:true,
    uniforms:Object.assign({},THREE.UniformsLib.fog,{
      cNear:{value:new THREE.Color(0.04,0.13,0.05)}, cFar:{value:new THREE.Color(0.06,0.17,0.11)}}),
    vertexShader:`varying vec3 vW; varying vec2 vUv;
#include <fog_pars_vertex>
      void main(){vUv=uv; vec4 mvPosition=modelViewMatrix*vec4(position,1.0); vW=position;
        gl_Position=projectionMatrix*mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader:`precision highp float; varying vec3 vW; varying vec2 vUv;
      uniform vec3 cNear,cFar;
${NOISE}
#include <fog_pars_fragment>
      void main(){
        float pch=fbm(vW.xz*0.25);
        vec3 c=mix(cNear,cFar,smoothstep(0.0,40.0,length(vW.xz)*0.5));
        c*=0.7+0.5*pch;
        gl_FragColor=vec4(c,1.0);
        #include <fog_fragment>
      }`}));
ground.rotation.x=-Math.PI/2; ground.position.y=0; scene.add(ground);

// ── VEGETATION LAYERS — billboards at increasing depth ──────────────
const LAYERS=12;
const vegUniforms=[];
function vegMat(i){
  const t=i/(LAYERS-1);
  const u=Object.assign({},THREE.UniformsLib.fog,{
    growth:{value:0}, bloomAmt:{value:0}, bloomCol:{value:new THREE.Color(0.9,0.3,0.4)},
    seed:{value:i*1.37+0.5}, depthT:{value:t}, density:{value:0.0}, accent:{value:new THREE.Color(1,1,1)}
  });
  vegUniforms.push(u);
  return new THREE.ShaderMaterial({transparent:true, depthWrite:false, fog:true, side:THREE.DoubleSide,
    uniforms:u,
    vertexShader:`varying vec2 vUv;
#include <fog_pars_vertex>
      void main(){vUv=uv; vec4 mvPosition=modelViewMatrix*vec4(position,1.0);
        gl_Position=projectionMatrix*mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader:`precision highp float; varying vec2 vUv;
      uniform float growth,bloomAmt,seed,depthT,density; uniform vec3 bloomCol,accent;
${NOISE}
#include <fog_pars_fragment>
      void main(){
        float x=vUv.x, y=vUv.y;
        // vegetation silhouette: clumps of foliage, taller with growth
        float clump=fbm(vec2(x*9.0+seed*3.1, seed));
        float blade=fbm(vec2(x*60.0+seed, 11.0));            // fine vertical detail
        float h=(0.18+0.72*clump)*(0.22+0.78*growth);
        h*=mix(1.05,0.7,depthT);                              // far layers a touch shorter
        float edge=0.012+0.03*depthT;
        float inside=smoothstep(h+edge,h-edge,y);             // 1 below silhouette
        if(inside<0.003 && bloomAmt<0.001) discard;

        // green body: deep at base → lit toward the tips, blade streaks
        vec3 deep=vec3(0.025,0.10,0.035), lit=vec3(0.13,0.42,0.13);
        vec3 green=mix(deep,lit,smoothstep(0.0,h,y));
        green*=0.62+0.5*blade;                                // vertical blade shading
        green*=0.75+0.35*clump;

        // blooms: some clumps flower near their tips; rise + glow with season
        float bseed=fbm(vec2(x*5.0+seed*7.0+19.0, 3.0));
        float flowers=smoothstep(0.50,0.63,bseed)*density;    // which columns carry a bloom
        float bloomY=h*mix(0.80,1.18, fract(bseed*13.0));      // sits at / rises above the foliage top
        float col=fract(x*5.0);                                // within-clump horizontal
        float glow=exp(-pow((y-bloomY)/0.060,2.0))*exp(-pow((col-0.5)/0.30,2.0));
        // a bright core + a softer halo so blooms read as points of light, not smears
        float core=exp(-pow((y-bloomY)/0.022,2.0))*exp(-pow((col-0.5)/0.16,2.0));
        float bloom=flowers*glow*bloomAmt;
        float bcoreI=flowers*core*bloomAmt;
        vec3 bcol=mix(bloomCol, accent, 0.3*smoothstep(0.5,1.0,fract(bseed*7.3))); // mostly saturated, occasional accent
        vec3 c=green*inside + bcol*bloom*2.2 + bcol*bcoreI*2.3;                     // keep colour, don't blow to white
        float a=max(inside, max(bloom,bcoreI)*1.1);
        gl_FragColor=vec4(c,a);
        #include <fog_fragment>
      }`});
}
const vegLayers=[];
for(let i=0;i<LAYERS;i++){
  const t=i/(LAYERS-1);
  const w=THREE.MathUtils.lerp(16,70,t), hgt=THREE.MathUtils.lerp(5.5,8.5,t);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,hgt), vegMat(i));
  const z=THREE.MathUtils.lerp(4.0,-38.0,t);
  m.position.set(0,hgt/2,z);
  m.renderOrder=i;                                            // near drawn last
  scene.add(m); vegLayers.push(m);
}

// ── POST: threshold bloom + ACES (carried from Trial 04/05) ─────────
const presentMat=new THREE.ShaderMaterial({
  uniforms:{src:{value:null},res:{value:new THREE.Vector2(innerWidth,innerHeight)},bloom:{value:0.7}},
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.);}`,
  fragmentShader:`precision highp float; varying vec2 vUv;
    uniform sampler2D src; uniform vec2 res; uniform float bloom;
    vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.);}
    void main(){
      vec3 base=texture2D(src,vUv).rgb; vec3 b=vec3(0.); float tot=0.;
      for(int i=1;i<=10;i++){float fr=float(i); float rad=fr*1.0/res.y; float w=1.0/(fr*fr);
        for(int k=0;k<8;k++){float a=float(k)/8.*6.2831; b+=texture2D(src,vUv+vec2(cos(a),sin(a))*rad).rgb*w; tot+=w;}}
      b/=tot; b=max(b-0.18,0.0)*1.2;
      vec3 col=base + b*bloom;
      col=aces(col*1.04); col=pow(col,vec3(0.94));
      float v=smoothstep(1.3,0.3,length(vUv-0.5));
      gl_FragColor=vec4(col*v,1.0);
    }`});

// ── season → growth + flowering palette ─────────────────────────────
const SEASONS=[{n:'winter',t:0},{n:'spring',t:80},{n:'summer',t:172},{n:'autumn',t:264},{n:'winter',t:340}];
function seasonName(d){for(let i=0;i<4;i++)if(d>=SEASONS[i].t&&d<SEASONS[i+1].t)return SEASONS[i].n;return'winter';}
function smooth(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);}
// growth: rises through spring, full summer, falls autumn, ~0 winter
function growthOf(d){ return smooth(35,150,d)*(1-smooth(250,345,d)); }
// flowering windows per season with their own palettes
const FLOWERS=[
  {s:55,p:110,e:165, col:[0.95,0.28,0.34], acc:[1.0,0.80,0.30]},  // spring: red tulip + gold
  {s:140,p:185,e:240, col:[0.62,0.38,0.95], acc:[0.95,0.95,1.0]}, // summer: allium violet + white
  {s:235,p:275,e:320, col:[0.98,0.45,0.14], acc:[0.85,0.20,0.12]} // autumn: ember orange + deep red
];
function flowerState(d){
  let amt=0, col=[0.6,0.4,0.5], acc=[1,1,1], dens=0;
  for(const f of FLOWERS){
    let e=0;
    if(d>=f.s&&d<=f.e){ e = d<f.p ? smooth(f.s,f.p,d) : 1-smooth(f.p,f.e,d); }
    if(e>amt){ amt=e; col=f.col; acc=f.acc; dens=Math.min(1,e*1.3); }
  }
  return {amt,col,acc,dens};
}

// ── loop ────────────────────────────────────────────────────────────
let last=null;
function frame(t){
  requestAnimationFrame(frame);
  if(last===null)last=t; const dtr=Math.min((t-last)/1000,0.05); last=t;
  if(!paused){ day+=speed*dtr; if(day>=YEAR){day-=YEAR; year++;} }

  const g=growthOf(day), fl=flowerState(day);
  for(let i=0;i<LAYERS;i++){
    const u=vegUniforms[i];
    // a little per-layer phase so the garden isn't a single moving wall
    const ph=0.86+0.14*Math.sin(i*1.3);
    u.growth.value=g*ph;
    u.bloomAmt.value=fl.amt*(0.7+0.5*Math.sin(i*2.1+1.0));
    u.density.value=fl.dens*(0.6+0.7*((i*37%11)/11));
    u.bloomCol.value.setRGB(fl.col[0],fl.col[1],fl.col[2]);
    u.accent.value.setRGB(fl.acc[0],fl.acc[1],fl.acc[2]);
  }

  renderer.setRenderTarget(sceneRT); renderer.render(scene,cam);
  presentMat.uniforms.src.value=sceneRT.texture;
  postQuad.material=presentMat;
  renderer.setRenderTarget(null); renderer.render(post,postCam);

  document.getElementById('day').textContent=Math.floor(day);
  document.getElementById('year').textContent=year;
  document.getElementById('season').textContent=seasonName(day);
}
requestAnimationFrame(frame);
window.__setDay=v=>{day=v;};   // test hook: jump to a given day
window.__pause=v=>{paused=v;};

// ── controls / resize ───────────────────────────────────────────────
addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  presentMat.uniforms.res.value.set(innerWidth,innerHeight);
  sceneRT.setSize(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio());
});
addEventListener('keydown',e=>{
  if(e.code==='Space'){paused=!paused;e.preventDefault();}
  if(e.code==='ArrowUp')speed=Math.min(speed*1.3,90);
  if(e.code==='ArrowDown')speed=Math.max(speed/1.3,1);
});
</script>
</body>
</html>
