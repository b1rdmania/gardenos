<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GardenOS — Trial 09 · Daytime Canopy</title>
<style>
  html,body{margin:0;height:100%;background:#cdd6d2;overflow:hidden;
    font-family:-apple-system,Inter,system-ui,sans-serif;color:#20302a}
  canvas{display:block}
  #hud{position:fixed;left:20px;bottom:18px;z-index:10;font-size:12px;letter-spacing:.05em;
    line-height:1.55;text-shadow:0 1px 6px rgba(255,255,255,.6);opacity:.85;pointer-events:none}
  #season{font-size:11px;text-transform:uppercase;letter-spacing:.24em;opacity:.6}
  #ev{font-size:11px;opacity:.7;margin-top:2px;min-height:14px}
  #title{position:fixed;right:20px;top:18px;z-index:10;text-align:right;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;opacity:.45;text-shadow:0 1px 6px rgba(255,255,255,.6)}
  #hint{position:fixed;left:20px;top:18px;z-index:10;font-size:11px;letter-spacing:.06em;
    opacity:.4;text-shadow:0 1px 6px rgba(255,255,255,.6)}
</style>
</head>
<body>
<div id="title">GardenOS · Trial 09<br><span style="opacity:.6">daytime canopy</span></div>
<div id="hint">space · pause   ·   ↑↓ · year speed</div>
<div id="hud"><div id="season">winter</div><div>day <b id="day">0</b> / 365 · year <b id="year">1</b></div><div id="ev"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ───────────────────────────────────────────────────────────────
   GardenOS — Trial 09 · Daytime Canopy
   The garden is mostly CANOPY, in DAYLIGHT. Layered foliage masses
   (trees, shrubs, the yellow Acer) built from individual leaf-dabs,
   over dark branches. The leaves carry the year:
     spring  leaf-out + blossom
     summer  full green
     autumn  colour turn (staggered, varied) + fall
     winter  bare branches
   The ground is just the floor now — the story is up in the leaves.
   ─────────────────────────────────────────────────────────────── */

const YEAR=365;
let day=0, year=1, speed=10, paused=false;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const FOG=new THREE.Color(0.80,0.85,0.85);                 // pale daytime haze
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 300);
cam.position.set(0,1.5,8.0); cam.lookAt(0,4.6,-16);        // look up into the canopy

const post=new THREE.Scene(), postCam=new THREE.Camera();
const postQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),null); post.add(postQuad);
let sceneRT=new THREE.WebGLRenderTarget(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio(),
  {type:THREE.HalfFloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});

const NOISE=`
  float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
  float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    float a=h21(i),b=h21(i+vec2(1,0)),c=h21(i+vec2(0,1)),d=h21(i+vec2(1,1));
    return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
  float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vnoise(p);p*=2.0;a*=.5;}return s;}
`;

// ── SKY (bright overcast London) ────────────────────────────────────
const sky=new THREE.Mesh(new THREE.PlaneGeometry(800,300),
  new THREE.ShaderMaterial({depthWrite:false,
    uniforms:{top:{value:new THREE.Color(0.52,0.66,0.82)},hor:{value:new THREE.Color(0.88,0.90,0.90)}},
    vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`precision highp float; varying vec2 vUv; uniform vec3 top,hor;
      void main(){ gl_FragColor=vec4(mix(hor,top,smoothstep(0.0,0.8,vUv.y)),1.0); }`}));
sky.position.set(0,40,-120); scene.add(sky);

// ── GROUND (lawn + patio, just the floor) ───────────────────────────
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),
  new THREE.ShaderMaterial({
    uniforms:{lawn:{value:new THREE.Color(0.26,0.40,0.16)},patio:{value:new THREE.Color(0.52,0.50,0.45)},
              fogColor:{value:FOG.clone()},fogNear:{value:8.0},fogFar:{value:90.0}},
    vertexShader:`varying vec3 vW; varying float vFog;
      void main(){vW=position; vec4 mv=modelViewMatrix*vec4(position,1.0); vFog=-mv.z;
        gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`precision highp float; varying vec3 vW; varying float vFog;
      uniform vec3 lawn,patio,fogColor; uniform float fogNear,fogFar;
${NOISE}
      void main(){
        float pth=smoothstep(2.0,4.0,-vW.z+ (fbm(vW.xz*0.4)-0.5)*1.5 );  // patio near, lawn beyond
        vec3 c=mix(patio,lawn,pth); c*=0.82+0.3*fbm(vW.xz*0.7);
        c=mix(c,fogColor,smoothstep(fogNear,fogFar,vFog));
        gl_FragColor=vec4(c,1.0);}`}));
ground.rotation.x=-Math.PI/2; scene.add(ground);

// ── FOLIAGE MASSES → leaf-dabs ──────────────────────────────────────
const R=Math.random;
function gauss(){return (R()+R()+R()-1.5)/1.5;}
// autumn colour palette (varied per leaf): ambers, oranges, reds, browns
const AUT=[[0.85,0.55,0.12],[0.88,0.40,0.10],[0.80,0.22,0.10],[0.72,0.45,0.14],[0.65,0.34,0.10]];
// foliage masses: layered like the photo — big trees back, shrubs mid, accents front
const MASSES=[
  // big trees — tall, near, ARCHING overhead to enclose the frame
  {c:[5,7.5,-15],  r:[11,6,5], n:8000, base:[0.09,0.24,0.09], branches:3, bloss:0},   // arching tree R (overhead)
  {c:[-9,6.5,-18], r:[9,6,5],  n:7000, base:[0.10,0.26,0.10], branches:3, bloss:0},   // tree L
  {c:[0,6.0,-26],  r:[18,6,6], n:9000, base:[0.11,0.28,0.11], branches:0, bloss:0},   // back wall of canopy
  // mid shrub layer (lower, fills the middle)
  {c:[-6,2.4,-12], r:[4,2.6,2.5], n:3800, base:[0.15,0.34,0.12], branches:0, bloss:0},
  {c:[6.5,2.2,-11],r:[3.8,2.4,2.5],n:3600, base:[0.13,0.32,0.12], branches:0, bloss:0}, // climber
  {c:[0,1.8,-9],   r:[3.4,1.8,2], n:2800, base:[0.16,0.36,0.13], branches:0, bloss:0},
  // the YELLOW ACER accent
  {c:[-7,2.3,-9],  r:[2.6,2.2,1.8], n:3200, base:[0.56,0.64,0.13], branches:0, bloss:0, acer:1},
  // blossoming foreground shrubs
  {c:[7,1.5,-6],   r:[2.0,1.6,1.4], n:2000, base:[0.16,0.36,0.13], branches:0, bloss:1},
  {c:[-8,1.4,-6],  r:[1.8,1.5,1.3], n:1900, base:[0.14,0.33,0.12], branches:0, bloss:1},
];
const LC=[], LE=[]; // leaf records, branch records
function pushLeaf(x,y,z,size,col,aut,turn,bloss,shade){
  LC.push(x,y,z, size, R(), col[0],col[1],col[2], aut[0],aut[1],aut[2], turn, bloss, shade);
}
const LSTR=14;
for(const m of MASSES){
  for(let i=0;i<m.n;i++){
    const ux=gauss(), uy=gauss(), uz=gauss();
    const x=m.c[0]+ux*m.r[0], y=Math.max(0.2,m.c[1]+uy*m.r[1]), z=m.c[2]+uz*m.r[2];
    const hN=THREE.MathUtils.clamp((y-(m.c[1]-m.r[1]))/(2*m.r[1]),0,1);  // height in crown → light
    const col=[m.base[0]*(0.7+0.6*R()), m.base[1]*(0.75+0.5*R()), m.base[2]*(0.7+0.6*R())];
    const aut = m.acer ? [0.92,0.62,0.10] : AUT[(R()*AUT.length)|0];
    const size=THREE.MathUtils.lerp(0.24,0.54, R())*(m.acer?0.9:1.0);
    pushLeaf(x,y,z, size, col, aut, R(), m.bloss?1:0, 0.55+0.55*hN);
  }
  // branches: dark limbs from base into the crown
  if(m.branches){
    const bx=m.c[0], bz=m.c[2], top=m.c[1]+m.r[1]*0.2;
    for(let b=0;b<m.branches+2;b++){
      const ang=(b/(m.branches+2))*6.28+R(); const reach=m.r[0]*0.7;
      LE.push(bx,0,bz, 0.18+R()*0.18, top+R()*1.2, Math.cos(ang)*reach*0.5, 0.04,0.035,0.03);
      LE.push(bx+Math.cos(ang)*reach*0.4, top*0.5, bz, 0.10+R()*0.1, top*0.7, Math.cos(ang)*reach, 0.05,0.04,0.03);
    }
  }
}
const NL=LC.length/LSTR, larr=Float32Array.from(LC);
function lslice(off,size){const a=new Float32Array(NL*size);
  for(let i=0;i<NL;i++)for(let j=0;j<size;j++)a[i*size+j]=larr[i*LSTR+off+j]; return a;}
const leafQ=new THREE.PlaneGeometry(1,1);
const lgeo=new THREE.InstancedBufferGeometry();
lgeo.index=leafQ.index; lgeo.attributes.position=leafQ.attributes.position; lgeo.attributes.uv=leafQ.attributes.uv;
lgeo.instanceCount=NL;
lgeo.setAttribute('iCenter',new THREE.InstancedBufferAttribute(lslice(0,3),3));
lgeo.setAttribute('iSize',  new THREE.InstancedBufferAttribute(lslice(3,1),1));
lgeo.setAttribute('iSeed',  new THREE.InstancedBufferAttribute(lslice(4,1),1));
lgeo.setAttribute('iCol',   new THREE.InstancedBufferAttribute(lslice(5,3),3));
lgeo.setAttribute('iAut',   new THREE.InstancedBufferAttribute(lslice(8,3),3));
lgeo.setAttribute('iTurn',  new THREE.InstancedBufferAttribute(lslice(11,1),1));
lgeo.setAttribute('iBloss', new THREE.InstancedBufferAttribute(lslice(12,1),1));
lgeo.setAttribute('iShade', new THREE.InstancedBufferAttribute(lslice(13,1),1));

const leafMat=new THREE.ShaderMaterial({
  transparent:true, depthTest:true, depthWrite:true, alphaTest:0.35, side:THREE.DoubleSide,
  uniforms:{ day:{value:0}, time:{value:0}, camRight:{value:new THREE.Vector3(1,0,0)}, camUp:{value:new THREE.Vector3(0,1,0)},
             fogColor:{value:FOG.clone()}, fogNear:{value:8.0}, fogFar:{value:90.0} },
  vertexShader:`
    attribute vec3 iCenter,iCol,iAut; attribute float iSize,iSeed,iTurn,iBloss,iShade;
    uniform float day,time; uniform vec3 camRight,camUp;
    varying vec2 vUv; varying vec3 vCol; varying float vFog,vKill;
    float sm(float a,float b,float x){x=clamp((x-a)/(b-a),0.0,1.0);return x*x*(3.0-2.0*x);}
    void main(){
      vUv=uv;
      float leafOut=sm(72.0,112.0,day);                          // spring leaf-out
      float fall=sm(298.0+iTurn*28.0, 340.0+iTurn*16.0, day);    // staggered autumn drop
      float scale=leafOut*(1.0-fall);
      float turn=sm(266.0+iTurn*46.0, 296.0+iTurn*46.0, day);    // staggered colour turn
      vec3 col=mix(iCol,iAut,turn);
      float bloss=iBloss*sm(70.0,90.0,day)*(1.0-sm(96.0,118.0,day));
      col=mix(col, vec3(1.0,0.93,0.96), bloss);                   // pale blossom
      col*=iShade;                                                // crown self-shading / top-light
      vCol=col; vKill=scale;
      float sc=iSize*(0.6+0.4*scale)*(1.0+bloss*0.25);
      vec2 q=uv-0.5;
      vec3 world=iCenter + camRight*(q.x*sc + sin(time*1.5+iSeed*30.0)*0.015)
                         + camUp*(q.y*sc);
      vec4 mv=viewMatrix*vec4(world,1.0); vFog=-mv.z;
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`precision highp float; varying vec2 vUv; varying vec3 vCol; varying float vFog,vKill;
    uniform vec3 fogColor; uniform float fogNear,fogFar;
    void main(){
      if(vKill<0.04) discard;                                     // winter: leaf gone
      vec2 q=vUv-0.5; float r=length(q*vec2(1.0,1.25));
      float a=smoothstep(0.5,0.28,r); if(a<0.35) discard;
      vec3 c=mix(vCol,fogColor,smoothstep(fogNear,fogFar,vFog));
      gl_FragColor=vec4(c,1.0);
    }`
});
const leaves=new THREE.Mesh(lgeo,leafMat); leaves.frustumCulled=false; scene.add(leaves);

// ── BRANCHES (dark limbs, Y-billboard tapered) ──────────────────────
const NE=LE.length/9, earr=Float32Array.from(LE);
function eslice(off,size){const a=new Float32Array(NE*size);
  for(let i=0;i<NE;i++)for(let j=0;j<size;j++)a[i*size+j]=earr[i*9+off+j]; return a;}
const bq=new THREE.PlaneGeometry(1,1); bq.translate(0,0.5,0);
const bgeo=new THREE.InstancedBufferGeometry();
bgeo.index=bq.index; bgeo.attributes.position=bq.attributes.position; bgeo.attributes.uv=bq.attributes.uv;
bgeo.instanceCount=NE;
bgeo.setAttribute('iBase', new THREE.InstancedBufferAttribute(eslice(0,3),3));
bgeo.setAttribute('iW',    new THREE.InstancedBufferAttribute(eslice(3,1),1));
bgeo.setAttribute('iH',    new THREE.InstancedBufferAttribute(eslice(4,1),1));
bgeo.setAttribute('iLean', new THREE.InstancedBufferAttribute(eslice(5,1),1));
bgeo.setAttribute('iCol',  new THREE.InstancedBufferAttribute(eslice(6,3),3));
const branchMat=new THREE.ShaderMaterial({transparent:true,depthTest:true,depthWrite:true,alphaTest:0.4,side:THREE.DoubleSide,
  uniforms:{camRight:{value:new THREE.Vector3(1,0,0)},fogColor:{value:FOG.clone()},fogNear:{value:8.0},fogFar:{value:90.0}},
  vertexShader:`attribute vec3 iBase,iCol; attribute float iW,iH,iLean; uniform vec3 camRight;
    varying vec2 vUv; varying vec3 vCol; varying float vFog;
    void main(){ vUv=uv; vCol=iCol;
      float w=iW*(1.0-uv.y*0.6);                                  // taper up
      vec3 world=iBase + camRight*((uv.x-0.5)*w + iLean*uv.y) + vec3(0.0,1.0,0.0)*(uv.y*iH);
      vec4 mv=viewMatrix*vec4(world,1.0); vFog=-mv.z;
      gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`precision highp float; varying vec2 vUv; varying vec3 vCol; varying float vFog;
    uniform vec3 fogColor; uniform float fogNear,fogFar;
    void main(){ float ax=abs(vUv.x-0.5)*2.0; float a=smoothstep(1.0,0.4,ax); if(a<0.4) discard;
      gl_FragColor=vec4(mix(vCol,fogColor,smoothstep(fogNear,fogFar,vFog)),1.0); }`});
const branches=new THREE.Mesh(bgeo,branchMat); branches.frustumCulled=false; scene.add(branches);

// ── BLOSSOM + LEAF-FALL particles ───────────────────────────────────
function petalField(n, spreadY, colA, colB){
  const p=new Float32Array(n*3), sd=new Float32Array(n);
  for(let i=0;i<n;i++){ p[i*3]=(R()*2-1)*16; p[i*3+1]=0; p[i*3+2]=THREE.MathUtils.lerp(4,-30,R()); sd[i]=R(); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(p,3)); g.setAttribute('sd',new THREE.BufferAttribute(sd,1));
  const m=new THREE.ShaderMaterial({transparent:true,depthTest:true,depthWrite:false,
    uniforms:{time:{value:0},amt:{value:0},dpr:{value:renderer.getPixelRatio()},topY:{value:spreadY},
              cA:{value:new THREE.Color(...colA)},cB:{value:new THREE.Color(...colB)},
              fogColor:{value:FOG.clone()},fogNear:{value:8.0},fogFar:{value:90.0}},
    vertexShader:`attribute float sd; uniform float time,amt,dpr,topY; varying float vA,vFog,vS;
      void main(){ vS=sd; vec3 p=position; float t=fract(sd+time*0.045*(0.6+sd));
        p.y=topY*t; p.x+=sin(time*0.8+sd*28.0)*1.1*(0.3+t); p.z+=cos(time*0.6+sd*12.0)*0.4;
        vA=amt*(0.6+0.4*sin(time*1.3+sd*10.0)); vec4 mv=viewMatrix*vec4(p,1.0); vFog=-mv.z;
        gl_Position=projectionMatrix*mv; gl_PointSize=7.0*dpr*(8.0/max(0.5,-mv.z)); }`,
    fragmentShader:`precision highp float; varying float vA,vFog,vS; uniform vec3 cA,cB,fogColor; uniform float fogNear,fogFar;
      void main(){ vec2 d=gl_PointCoord-0.5; if(length(d)>0.5) discard;
        float a=smoothstep(0.5,0.15,length(d))*vA; if(a<0.03) discard;
        vec3 c=mix(cA,cB,vS); c=mix(c,fogColor,smoothstep(fogNear,fogFar,vFog)*0.7);
        gl_FragColor=vec4(c,a); }`});
  const pts=new THREE.Points(g,m); pts.frustumCulled=false; scene.add(pts); return m;
}
const blossomFall=petalField(260, 6.0, [1.0,0.93,0.96],[1.0,0.80,0.86]);   // spring petals
const leafFall   =petalField(360, 7.5, [0.86,0.52,0.12],[0.72,0.28,0.10]); // autumn leaves

// ── POST (soft daylight) ────────────────────────────────────────────
const postU={src:{value:null},res:{value:new THREE.Vector2(innerWidth,innerHeight)},bloom:{value:0.35}};
const presentMat=new THREE.ShaderMaterial({uniforms:postU,
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.);}`,
  fragmentShader:`precision highp float; varying vec2 vUv;
    uniform sampler2D src; uniform vec2 res; uniform float bloom;
    vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.);}
    void main(){ vec3 base=texture2D(src,vUv).rgb; vec3 b=vec3(0.); float tot=0.;
      for(int i=1;i<=6;i++){float fr=float(i); float rad=fr*1.0/res.y; float w=1.0/(fr*fr);
        for(int k=0;k<6;k++){float a=float(k)/6.*6.2831; b+=texture2D(src,vUv+vec2(cos(a),sin(a))*rad).rgb*w; tot+=w;}}
      b/=tot; b=max(b-0.6,0.0);                                   // only highlights bloom (bright sky/blossom)
      vec3 col=base + b*bloom;
      col=aces(col*1.05); col=pow(col,vec3(0.94));
      gl_FragColor=vec4(col,1.0);
    }`});

// ── season + events + loop ──────────────────────────────────────────
const SEASONS=[{n:'winter',t:0},{n:'spring',t:80},{n:'summer',t:172},{n:'autumn',t:264},{n:'winter',t:340}];
function seasonName(d){for(let i=0;i<4;i++)if(d>=SEASONS[i].t&&d<SEASONS[i+1].t)return SEASONS[i].n;return'winter';}
function smooth(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);}
const EVENTS=[ [40,'bare branches'],[78,'blossom breaks'],[110,'leaf-out complete'],[150,'in full leaf'],
  [185,'high summer canopy'],[268,'leaves begin to turn'],[300,'leaf fall'],[338,'bare again'] ];
function currentEvent(d){let e=''; for(const [t,n] of EVENTS){if(d>=t)e=n;} return e;}

const _r=new THREE.Vector3(), _u=new THREE.Vector3();
let last=null;
function frame(t){
  requestAnimationFrame(frame);
  if(last===null)last=t; const dtr=Math.min((t-last)/1000,0.05); last=t;
  if(!paused){ day+=speed*dtr; if(day>=YEAR){day-=YEAR; year++;} }
  const tm=t*0.001;
  _r.setFromMatrixColumn(cam.matrixWorld,0); _u.setFromMatrixColumn(cam.matrixWorld,1);
  leafMat.uniforms.camRight.value.copy(_r); leafMat.uniforms.camUp.value.copy(_u);
  branchMat.uniforms.camRight.value.copy(_r);
  leafMat.uniforms.day.value=day; leafMat.uniforms.time.value=tm;
  blossomFall.uniforms.time.value=tm; blossomFall.uniforms.amt.value=smooth(80,96,day)*(1-smooth(108,124,day));
  leafFall.uniforms.time.value=tm; leafFall.uniforms.amt.value=smooth(285,312,day)*(1-smooth(336,358,day));

  renderer.setRenderTarget(sceneRT); renderer.render(scene,cam);
  postU.src.value=sceneRT.texture; postQuad.material=presentMat;
  renderer.setRenderTarget(null); renderer.render(post,postCam);
  document.getElementById('day').textContent=Math.floor(day);
  document.getElementById('year').textContent=year;
  document.getElementById('season').textContent=seasonName(day);
  document.getElementById('ev').textContent=currentEvent(day);
}
requestAnimationFrame(frame);
window.__setDay=v=>{day=v;}; window.__pause=v=>{paused=v;};

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  postU.res.value.set(innerWidth,innerHeight);
  sceneRT.setSize(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio());
});
addEventListener('keydown',e=>{
  if(e.code==='Space'){paused=!paused;e.preventDefault();}
  if(e.code==='ArrowUp')speed=Math.min(speed*1.3,90);
  if(e.code==='ArrowDown')speed=Math.max(speed/1.3,1);
});
</script>
</body>
</html>
