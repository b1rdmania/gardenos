<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GardenOS — Trial 07a · Nocturne</title>
<style>
  html,body{margin:0;height:100%;background:#01030a;overflow:hidden;
    font-family:-apple-system,Inter,system-ui,sans-serif;color:#eef0e8}
  canvas{display:block}
  #hud{position:fixed;left:20px;bottom:18px;z-index:10;font-size:12px;letter-spacing:.05em;
    line-height:1.55;text-shadow:0 1px 12px #000;opacity:.85;pointer-events:none}
  #season{font-size:11px;text-transform:uppercase;letter-spacing:.24em;opacity:.6}
  #title{position:fixed;right:20px;top:18px;z-index:10;text-align:right;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;opacity:.4;text-shadow:0 1px 12px #000}
  #hint{position:fixed;left:20px;top:18px;z-index:10;font-size:11px;letter-spacing:.06em;
    opacity:.32;text-shadow:0 1px 12px #000}
</style>
</head>
<body>
<div id="title">GardenOS · Trial 07a<br><span style="opacity:.6">nocturne</span></div>
<div id="hint">space · pause   ·   ↑↓ · year speed</div>
<div id="hud"><div id="season">winter</div><div>day <b id="day">0</b> / 365 · year <b id="year">1</b></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ───────────────────────────────────────────────────────────────
   GardenOS — Trial 07a · Nocturne (look locked + discrete blooms)
   Nocturne palette. Blooms are now a PARTICLE FIELD — thousands of
   glowing flower sprites scattered through the garden at depth, each
   tied to a species' season window: it rises and ignites when its
   season comes, fades after, fog dissolves the far ones. Discrete
   points of light, not aurora-bands. Foliage is the dark green ground.
   ─────────────────────────────────────────────────────────────── */

const YEAR=365;
let day=0, year=1, speed=10, paused=false;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const FOG=new THREE.Color(0.02,0.05,0.06);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(FOG, 6, 40);
const cam=new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
cam.position.set(0,1.35,7.0); cam.lookAt(0,1.2,-14);

const post=new THREE.Scene(), postCam=new THREE.Camera();
const postQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),null); post.add(postQuad);
let sceneRT=new THREE.WebGLRenderTarget(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio(),
  {type:THREE.HalfFloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});

const NOISE=`
  float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
  float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    float a=h21(i),b=h21(i+vec2(1,0)),c=h21(i+vec2(0,1)),d=h21(i+vec2(1,1));
    return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
  float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p*=2.0;a*=.5;}return s;}
`;

// ── SKY (dark, faint warm horizon) ──────────────────────────────────
const sky=new THREE.Mesh(new THREE.PlaneGeometry(400,160),
  new THREE.ShaderMaterial({fog:false,depthWrite:false,
    uniforms:{top:{value:new THREE.Color(0.01,0.02,0.05)},mid:{value:new THREE.Color(0.03,0.06,0.09)},
              hor:{value:FOG.clone()},warm:{value:new THREE.Color(0.10,0.10,0.20)}},
    vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`precision highp float; varying vec2 vUv; uniform vec3 top,mid,hor,warm;
      void main(){float y=vUv.y; vec3 c=mix(hor,mid,smoothstep(0.0,0.35,y));
        c=mix(c,top,smoothstep(0.3,1.0,y)); c+=warm*exp(-pow((y-0.04)/0.10,2.0))*0.5;
        gl_FragColor=vec4(c,1.0);}`}));
sky.position.set(0,60,-70); scene.add(sky);

// ── GROUND ──────────────────────────────────────────────────────────
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),
  new THREE.ShaderMaterial({fog:true,
    uniforms:Object.assign({},THREE.UniformsLib.fog,{cNear:{value:new THREE.Color(0.01,0.04,0.02)},cFar:{value:new THREE.Color(0.02,0.06,0.05)}}),
    vertexShader:`varying vec3 vW;
#include <fog_pars_vertex>
      void main(){vec4 mvPosition=modelViewMatrix*vec4(position,1.0); vW=position;
        gl_Position=projectionMatrix*mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader:`precision highp float; varying vec3 vW; uniform vec3 cNear,cFar;
${NOISE}
#include <fog_pars_fragment>
      void main(){float pch=fbm(vW.xz*0.25);
        vec3 c=mix(cNear,cFar,smoothstep(0.0,40.0,length(vW.xz)*0.5)); c*=0.7+0.5*pch;
        gl_FragColor=vec4(c,1.0);
        #include <fog_fragment>
      }`}));
ground.rotation.x=-Math.PI/2; scene.add(ground);

// ── FOLIAGE LAYERS (dark green, no blooms now — points carry blooms) ─
const LAYERS=12; const vegU=[];
function vegMat(i){
  const t=i/(LAYERS-1);
  const u=Object.assign({},THREE.UniformsLib.fog,{growth:{value:0},depthT:{value:t},seed:{value:i*1.37+0.5},
    deep:{value:new THREE.Color(0.01,0.05,0.02)},lit:{value:new THREE.Color(0.05,0.18,0.08)}});
  vegU.push(u);
  return new THREE.ShaderMaterial({transparent:true,depthWrite:false,fog:true,side:THREE.DoubleSide,uniforms:u,
    vertexShader:`varying vec2 vUv;
#include <fog_pars_vertex>
      void main(){vUv=uv; vec4 mvPosition=modelViewMatrix*vec4(position,1.0);
        gl_Position=projectionMatrix*mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader:`precision highp float; varying vec2 vUv;
      uniform float growth,depthT,seed; uniform vec3 deep,lit;
${NOISE}
#include <fog_pars_fragment>
      void main(){
        float x=vUv.x,y=vUv.y;
        float clump=fbm(vec2(x*9.0+seed*3.1,seed));
        float blade=fbm(vec2(x*60.0+seed,11.0));
        float h=(0.18+0.72*clump)*(0.22+0.78*growth)*mix(1.05,0.7,depthT);
        float edge=0.012+0.03*depthT;
        float inside=smoothstep(h+edge,h-edge,y);
        inside*=smoothstep(0.0,0.05,y);            // fade the base → kills the foreground seam
        if(inside<0.003) discard;
        vec3 green=mix(deep,lit,smoothstep(0.0,h,y));
        green*=0.7+0.5*blade; green*=0.75+0.35*clump;
        gl_FragColor=vec4(green,inside);
        #include <fog_fragment>
      }`});
}
for(let i=0;i<LAYERS;i++){
  const t=i/(LAYERS-1), w=THREE.MathUtils.lerp(16,70,t), hgt=THREE.MathUtils.lerp(5.5,8.5,t);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,hgt), vegMat(i));
  m.position.set(0,hgt/2, THREE.MathUtils.lerp(5.5,-38.0,t)); m.renderOrder=i;
  scene.add(m);
}

// ── BLOOM PARTICLE FIELD — discrete glowing flowers ─────────────────
const NP=1800;
const pos=new Float32Array(NP*3), aSeed=new Float32Array(NP), aSpec=new Float32Array(NP),
      aH=new Float32Array(NP), aSize=new Float32Array(NP);
for(let i=0;i<NP;i++){
  const z=THREE.MathUtils.lerp(5.5,-36, Math.pow(Math.random(),0.7));   // bias toward nearer
  const spread=THREE.MathUtils.mapLinear(z,5.5,-36, 9, 38);
  pos[i*3]=(Math.random()*2-1)*spread; pos[i*3+1]=0; pos[i*3+2]=z;
  aSeed[i]=Math.random(); aSpec[i]=Math.floor(Math.random()*3);
  aH[i]=THREE.MathUtils.lerp(0.5,2.4,Math.random());                    // how high it rises
  aSize[i]=THREE.MathUtils.lerp(10,30,Math.random());
}
const pg=new THREE.BufferGeometry();
pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
pg.setAttribute('aSeed',new THREE.BufferAttribute(aSeed,1));
pg.setAttribute('aSpec',new THREE.BufferAttribute(aSpec,1));
pg.setAttribute('aH',new THREE.BufferAttribute(aH,1));
pg.setAttribute('aSize',new THREE.BufferAttribute(aSize,1));

// species colours (Nocturne, vivid) + their season windows (start,peak,end)
const SPCOL=[ new THREE.Color(1.0,0.26,0.42),   // spring — hot pink/red
              new THREE.Color(0.62,0.52,1.0),   // summer — violet
              new THREE.Color(1.0,0.46,0.13) ]; // autumn — ember
const SPWIN=[ new THREE.Vector3(55,110,170), new THREE.Vector3(140,185,245), new THREE.Vector3(235,275,325) ];

const bloomMat=new THREE.ShaderMaterial({
  transparent:true, depthTest:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:Object.assign({},THREE.UniformsLib.fog,{
    day:{value:0}, growth:{value:0},
    col0:{value:SPCOL[0]}, col1:{value:SPCOL[1]}, col2:{value:SPCOL[2]},
    win0:{value:SPWIN[0]}, win1:{value:SPWIN[1]}, win2:{value:SPWIN[2]}, dpr:{value:renderer.getPixelRatio()}
  }),
  vertexShader:`
    attribute float aSeed,aSpec,aH,aSize;
    uniform float day,growth,dpr; uniform vec3 win0,win1,win2;
    varying vec3 vCol; varying float vI;
    uniform vec3 col0,col1,col2;
#include <fog_pars_vertex>
    float wstate(float d, vec3 w){ if(d<w.x||d>w.z) return 0.0;
      float up=smoothstep(w.x,w.y,d); float dn=1.0-smoothstep(w.y,w.z,d); return up*dn; }
    void main(){
      vec3 w = aSpec<0.5?win0:(aSpec<1.5?win1:win2);
      vec3 c = aSpec<0.5?col0:(aSpec<1.5?col1:col2);
      float e = wstate(day,w);
      e *= 0.55+0.45*aSeed;                                   // per-flower variation
      e *= 0.8+0.2*sin(day*0.5 + aSeed*30.0);                 // gentle flicker
      vCol=c; vI=clamp(e,0.0,1.0);
      vec3 p=position; p.y = aH*growth*(0.25+0.75*vI);        // rise as it blooms
      vec4 mvPosition=modelViewMatrix*vec4(p,1.0);
      gl_Position=projectionMatrix*mvPosition;
      gl_PointSize = aSize*dpr*vI*(8.0/max(0.5,-mvPosition.z));
#include <fog_vertex>
    }`,
  fragmentShader:`precision highp float; varying vec3 vCol; varying float vI;
#include <fog_pars_fragment>
    void main(){
      if(vI<0.01) discard;
      vec2 d=gl_PointCoord-0.5; float r=length(d);
      if(r>0.5) discard;
      float halo=exp(-r*r*7.0); float core=exp(-r*r*48.0);
      vec3 c=vCol*(halo*0.8+core*1.6)*vI;
      gl_FragColor=vec4(c,1.0);
      #include <fog_fragment>                                  // additive + fog → far blooms dissolve
    }`
});
const bloomPts=new THREE.Points(pg,bloomMat); bloomPts.frustumCulled=false; scene.add(bloomPts);

// ── POST (Nocturne: strong threshold bloom) ─────────────────────────
const postU={src:{value:null},res:{value:new THREE.Vector2(innerWidth,innerHeight)},bloom:{value:1.1}};
const presentMat=new THREE.ShaderMaterial({uniforms:postU,
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.);}`,
  fragmentShader:`precision highp float; varying vec2 vUv;
    uniform sampler2D src; uniform vec2 res; uniform float bloom;
    vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.);}
    void main(){
      vec3 base=texture2D(src,vUv).rgb; vec3 b=vec3(0.); float tot=0.;
      for(int i=1;i<=10;i++){float fr=float(i); float rad=fr*1.1/res.y; float w=1.0/(fr*fr);
        for(int k=0;k<8;k++){float a=float(k)/8.*6.2831; b+=texture2D(src,vUv+vec2(cos(a),sin(a))*rad).rgb*w; tot+=w;}}
      b/=tot; b=max(b-0.09,0.0)*1.3;
      vec3 col=base + b*bloom;
      col=aces(col*1.02); col=pow(col,vec3(0.92));
      float v=1.0-0.5*smoothstep(0.2,1.3,length(vUv-0.5))*2.0; v=clamp(v,0.0,1.0);
      gl_FragColor=vec4(col*v,1.0);
    }`});

// ── season → growth + flowering ─────────────────────────────────────
const SEASONS=[{n:'winter',t:0},{n:'spring',t:80},{n:'summer',t:172},{n:'autumn',t:264},{n:'winter',t:340}];
function seasonName(d){for(let i=0;i<4;i++)if(d>=SEASONS[i].t&&d<SEASONS[i+1].t)return SEASONS[i].n;return'winter';}
function smooth(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);}
function growthOf(d){return smooth(35,150,d)*(1-smooth(250,345,d));}

let last=null;
function frame(t){
  requestAnimationFrame(frame);
  if(last===null)last=t; const dtr=Math.min((t-last)/1000,0.05); last=t;
  if(!paused){ day+=speed*dtr; if(day>=YEAR){day-=YEAR; year++;} }
  const g=growthOf(day);
  for(let i=0;i<LAYERS;i++) vegU[i].growth.value=g*(0.86+0.14*Math.sin(i*1.3));
  bloomMat.uniforms.day.value=day; bloomMat.uniforms.growth.value=Math.max(0.25,g);

  renderer.setRenderTarget(sceneRT); renderer.render(scene,cam);
  postU.src.value=sceneRT.texture; postQuad.material=presentMat;
  renderer.setRenderTarget(null); renderer.render(post,postCam);
  document.getElementById('day').textContent=Math.floor(day);
  document.getElementById('year').textContent=year;
  document.getElementById('season').textContent=seasonName(day);
}
requestAnimationFrame(frame);
window.__setDay=v=>{day=v;}; window.__pause=v=>{paused=v;};

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  postU.res.value.set(innerWidth,innerHeight);
  sceneRT.setSize(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio());
});
addEventListener('keydown',e=>{
  if(e.code==='Space'){paused=!paused;e.preventDefault();}
  if(e.code==='ArrowUp')speed=Math.min(speed*1.3,90);
  if(e.code==='ArrowDown')speed=Math.max(speed/1.3,1);
});
</script>
</body>
</html>
