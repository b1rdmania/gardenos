<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GardenOS — A Garden Through Time</title>
<style>
  html,body{margin:0;height:100%;background:#cdd6d2;overflow:hidden;
    font-family:-apple-system,Inter,system-ui,sans-serif;color:#20302a}
  canvas{display:block}
  #hud{position:fixed;left:20px;bottom:18px;z-index:10;font-size:12px;letter-spacing:.05em;
    line-height:1.55;text-shadow:0 1px 6px rgba(255,255,255,.6);opacity:.85;pointer-events:none}
  #season{font-size:11px;text-transform:uppercase;letter-spacing:.24em;opacity:.6}
  #ev{font-size:11px;opacity:.72;margin-top:2px;min-height:14px}
  #title{position:fixed;right:20px;top:18px;z-index:10;text-align:right;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;opacity:.45;text-shadow:0 1px 6px rgba(255,255,255,.6)}
  #hint{position:fixed;left:20px;top:18px;z-index:10;font-size:11px;letter-spacing:.06em;
    opacity:.4;text-shadow:0 1px 6px rgba(255,255,255,.6)}
</style>
</head>
<body>
<div id="title">GardenOS · Trial 13<br><span style="opacity:.6">flower forms · full beds</span></div>
<div id="hint">space · pause   ·   ↑↓ · year speed</div>
<div id="hud"><div id="season">winter</div><div>day <b id="day">0</b> / 365 · year <b id="year">1</b></div><div id="ev"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ───────────────────────────────────────────────────────────────
   GardenOS — Trial 10 · The Merge (daytime master)
   Canopy (09) + woodland floor (07d) + living layers (08: dapple +
   pollinators) in ONE daytime scene. Enclosing canopy framing,
   organic brown branching trees, a proper maple autumn.
   ─────────────────────────────────────────────────────────────── */

const YEAR=365;
let day=0, year=1, speed=10, paused=false;

const renderer=new THREE.WebGLRenderer({antialias:true});
// device quality scaling — fewer instances + lower pixel ratio on phones so it runs smooth
const MOBILE = Math.min(innerWidth,innerHeight)<620 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const Q = MOBILE ? 0.5 : 1.0;
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE?1.2:1.35));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const FOG=new THREE.Color(0.80,0.85,0.85);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 400);
// responsive framing: portrait phones get a wider FOV + pulled-back camera so the
// side beds stay in frame instead of cropping to just the path
function layout(){
  const a=innerWidth/innerHeight; cam.aspect=a;
  const t=Math.min(1,Math.max(0,(1.5-a)/(1.5-0.45)));   // 0 landscape → 1 tall portrait
  cam.fov=60+24*t;                                       // 60 → 84
  cam.position.set(0, 1.5+0.15*t, 8.5+4.2*t);            // pull back for width
  cam.lookAt(0, 4.4+1.6*t, -16);                          // look higher on portrait → less empty foreground
  cam.updateProjectionMatrix();
}
layout();

const post=new THREE.Scene(), postCam=new THREE.Camera();
const postQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),null); post.add(postQuad);
let sceneRT=new THREE.WebGLRenderTarget(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio(),
  {type:THREE.HalfFloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});

const NOISE=`
  float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
  float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    float a=h21(i),b=h21(i+vec2(1,0)),c=h21(i+vec2(0,1)),d=h21(i+vec2(1,1));
    return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
  float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vnoise(p);p*=2.0;a*=.5;}return s;}`;
const DAPPLE=`float dapple(vec2 wxz,float tm){ float d=fbm(wxz*0.5+vec2(tm*0.05,tm*0.03));
  d=mix(d,fbm(wxz*1.2-vec2(tm*0.04,0.0)),0.4); return smoothstep(0.34,0.72,d); }`;
// a coherent breeze: gusts roll across the garden, taller things sway more
const WIND=`vec3 windOffset(vec3 p, float tm, float amp){
  float gust=0.6+0.4*sin(tm*0.4 + p.x*0.04 + p.z*0.03);
  float r=sin(tm*1.6 + p.x*0.5 + p.z*0.6) + 0.5*sin(tm*2.7 + p.z*0.9 + p.x*0.2);
  float a=amp*gust; return vec3(a*r, 0.0, a*0.45*r); }`;

const R=Math.random; function gauss(){return (R()+R()+R()-1.5)/1.5;}

// ── garden structure: lawn / earth beds / stone path (shared JS+GLSL) ─
// beds = side borders (|x| beyond a wavy edge); path winds up the centre; patio in front
function bedEdgeJS(z){return 3.2+Math.sin(z*0.7)*0.6+Math.sin(z*1.9+1.0)*0.4;}
function pathCJS(z){return Math.sin(z*0.18)*1.6;}
function inBed(x,z){return z<4.4 && Math.abs(x)>bedEdgeJS(z) && Math.abs(x)<bedEdgeJS(z)+5.8;}
const BATH=[-1.7,-0.8];                                 // bird-bath: open near lawn, left of the path
function nearBath(x,z){return (x-BATH[0])*(x-BATH[0])+(z-BATH[1])*(z-BATH[1])<1.3;}
const ZONE=`
  float bedEdge(float z){return 3.2+sin(z*0.7)*0.6+sin(z*1.9+1.0)*0.4;}
  float pathC(float z){return sin(z*0.18)*1.6;}`;

// ── SKY ─────────────────────────────────────────────────────────────
const sky=new THREE.Mesh(new THREE.PlaneGeometry(900,360),
  new THREE.ShaderMaterial({depthWrite:false,
    uniforms:{top:{value:new THREE.Color(0.50,0.65,0.82)},hor:{value:new THREE.Color(0.90,0.91,0.90)}},
    vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`precision highp float; varying vec2 vUv; uniform vec3 top,hor;
      void main(){ gl_FragColor=vec4(mix(hor,top,smoothstep(0.0,0.85,vUv.y)),1.0);}`}));
sky.position.set(0,40,-140); scene.add(sky);

// ── GROUND (lawn + patio, dappled) ──────────────────────────────────
const groundU={lawn:{value:new THREE.Color(0.30,0.44,0.18)},patio:{value:new THREE.Color(0.55,0.53,0.47)},
  fogColor:{value:FOG.clone()},fogNear:{value:9.0},fogFar:{value:95.0},time:{value:0},dap:{value:0.6}};
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),
  new THREE.ShaderMaterial({uniforms:groundU,
    vertexShader:`varying vec3 vWorld; varying float vFog;
      void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vWorld=wp.xyz;
        vec4 mv=modelViewMatrix*vec4(position,1.0); vFog=-mv.z;
        gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`precision highp float; varying vec3 vWorld; varying float vFog;
      uniform vec3 lawn,patio,fogColor; uniform float fogNear,fogFar,time,dap;
${NOISE}
${DAPPLE}
${ZONE}
      void main(){
        float x=vWorld.x, z=vWorld.z;
        vec3 stone=patio*(0.82+0.32*fbm(vWorld.xz*0.8));
        vec3 lawnC=lawn*(0.78+0.4*fbm(vWorld.xz*0.9));
        vec3 earth=mix(vec3(0.10,0.08,0.055),vec3(0.10,0.12,0.06),fbm(vWorld.xz*2.2))*(0.7+0.5*fbm(vWorld.xz*1.5)); // dark mulch + leaf litter
        float be=bedEdge(z), pc=pathC(z);
        vec3 c;
        if(z>4.4) c=stone;                                  // patio
        else if(abs(x)>be) c=earth;                          // garden beds (soil)
        else if(abs(x-pc)<0.9) c=stone;                      // path winding up the middle
        else c=lawnC;                                         // mown lawn
        float dp=dapple(vWorld.xz,time); c*=mix(1.0-0.35*dap,1.0+0.5*dap,dp);
        c=mix(c,fogColor,smoothstep(fogNear,fogFar,vFog));
        gl_FragColor=vec4(c,1.0);}`}));
ground.rotation.x=-Math.PI/2; scene.add(ground);

// ── BIRD BATH (cottage-garden focal ornament) ───────────────────────
function stoneMat(col){ return new THREE.ShaderMaterial({
  uniforms:{c:{value:new THREE.Color(col)},fogColor:{value:FOG.clone()},fogNear:{value:9.0},fogFar:{value:95.0}},
  vertexShader:`varying vec3 vN; varying float vFog;
    void main(){ vN=mat3(modelMatrix)*normal; vec4 mv=modelViewMatrix*vec4(position,1.0); vFog=-mv.z;
      gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`precision highp float; varying vec3 vN; varying float vFog; uniform vec3 c,fogColor; uniform float fogNear,fogFar;
    void main(){ float l=0.55+0.45*clamp(normalize(vN).y,0.0,1.0); vec3 col=c*l;
      col=mix(col,fogColor,smoothstep(fogNear,fogFar,vFog)); gl_FragColor=vec4(col,1.0); }`}); }
const bb=new THREE.Group();
function bbPart(geo,y){ const m=new THREE.Mesh(geo,stoneMat(0x8c857a)); m.position.y=y; bb.add(m); }
bbPart(new THREE.CylinderGeometry(0.30,0.36,0.10,16),0.05);   // base
bbPart(new THREE.CylinderGeometry(0.10,0.16,0.95,12),0.55);   // pedestal
bbPart(new THREE.CylinderGeometry(0.46,0.30,0.16,20),1.05);   // bowl
const water=new THREE.Mesh(new THREE.CircleGeometry(0.42,22),new THREE.ShaderMaterial({
  uniforms:{time:{value:0},fogColor:{value:FOG.clone()},fogNear:{value:9.0},fogFar:{value:95.0}},
  vertexShader:`varying vec2 vP; varying float vFog; void main(){ vP=position.xy;
    vec4 mv=modelViewMatrix*vec4(position,1.0); vFog=-mv.z; gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`precision highp float; varying vec2 vP; varying float vFog; uniform float time,fogNear,fogFar; uniform vec3 fogColor;
    void main(){ float rip=0.5+0.5*sin(length(vP)*40.0-time*2.0);
      vec3 col=mix(vec3(0.42,0.55,0.62),vec3(0.78,0.86,0.9),rip*0.5);   // sky-reflecting water + ripple
      col=mix(col,fogColor,smoothstep(fogNear,fogFar,vFog)); gl_FragColor=vec4(col,1.0); }`}));
water.rotation.x=-Math.PI/2; water.position.y=1.10; bb.add(water);
bb.position.set(BATH[0],0,BATH[1]); bb.scale.setScalar(1.4); scene.add(bb);

// ── ENCLOSURE — side fences + a body behind the hedge (the garden is walled in, not floating) ─
const fenceMat=new THREE.ShaderMaterial({side:THREE.DoubleSide,
  uniforms:{fogColor:{value:FOG.clone()},fogNear:{value:9.0},fogFar:{value:95.0}},
  vertexShader:`varying vec3 vWorld; varying float vFog;
    void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vWorld=wp.xyz;
      vec4 mv=modelViewMatrix*vec4(position,1.0); vFog=-mv.z; gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`precision highp float; varying vec3 vWorld; varying float vFog;
    uniform vec3 fogColor; uniform float fogNear,fogFar;
${NOISE}
    void main(){ vec3 c=vec3(0.23,0.185,0.14)*(0.75+0.5*fbm(vWorld.zy*vec2(0.8,2.2)));  // weathered larch
      float slat=fract(vWorld.z/0.46); float edge=min(slat,1.0-slat);
      c*=0.62+0.38*smoothstep(0.015,0.07,edge);                                          // board gaps
      c=mix(c,fogColor,smoothstep(fogNear,fogFar,vFog)); gl_FragColor=vec4(c,1.0); }`});
for(const sx of [-1,1]){
  const f=new THREE.Mesh(new THREE.PlaneGeometry(34,1.75),fenceMat);
  f.rotation.y=sx>0?-Math.PI/2:Math.PI/2; f.position.set(sx*9.8,0.875,-11.5); scene.add(f);
}
// climbing roses clothe the fences — anchor points here, foliage + blooms emitted by the instanced systems
const CLIMBERS=[];
for(const side of [-1,1]) for(let k=0;k<3;k++) CLIMBERS.push({sx:side*9.55, cz:-3.5-k*7.5+R()*3});
// dark green mass behind the back hedge so its leaf-dabs read as a clipped surface
// (without it the hedge floats as a detached cloud once the trees in front go bare)
const hedgeBody=new THREE.Mesh(new THREE.PlaneGeometry(40,9.6),new THREE.ShaderMaterial({
  uniforms:{fogColor:{value:FOG.clone()},fogNear:{value:9.0},fogFar:{value:95.0}},
  vertexShader:`varying vec3 vWorld; varying float vFog;
    void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vWorld=wp.xyz;
      vec4 mv=modelViewMatrix*vec4(position,1.0); vFog=-mv.z; gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`precision highp float; varying vec3 vWorld; varying float vFog;
    uniform vec3 fogColor; uniform float fogNear,fogFar;
${NOISE}
    void main(){
      float top=7.4+1.6*fbm(vec2(vWorld.x*0.4,3.7));                  // irregular clipped top, not a hard rectangle
      float side=19.0-1.2*fbm(vec2(vWorld.y*0.6,vWorld.x*0.1));
      if(vWorld.y>top||abs(vWorld.x)>side) discard;
      vec3 c=vec3(0.035,0.085,0.04)*(0.55+0.7*fbm(vWorld.xy*1.3));
      c=mix(c,fogColor,smoothstep(fogNear,fogFar,vFog)*0.55);          // resist the fog wash — it must stay darker than the dabs
      gl_FragColor=vec4(c,1.0); }`}));
hedgeBody.position.set(0,4.6,-27.8); scene.add(hedgeBody);

// ── CANOPY leaf-dabs (enclosing) + maple autumn ─────────────────────
// each leaf: base green + autumn MID + autumn LATE stops (progression green→mid→late)
const MASSES=[
  // each tree: its own autumn TONE (mid→late) and its own TIMING (at = how late it turns)
  {c:[8.7,7.0,-12],r:[7,4.7,4.7],n:9000, g:[0.10,0.26,0.10], mid:[0.90,0.68,0.18], late:[0.82,0.55,0.14], tree:1, at:0.10}, // R tree — GOLD, early
  {c:[-10,6.6,-13],r:[7,4.7,4.7],n:8500, g:[0.10,0.27,0.10], mid:[0.92,0.56,0.14], late:[0.80,0.36,0.10], tree:1, at:0.45}, // L tree — ORANGE, late
  {c:[0,4.8,-27],  r:[15,4.4,7],n:8000, g:[0.09,0.23,0.10], mid:[0.09,0.23,0.10], late:[0.09,0.23,0.10], ever:1},          // back wall — EVERGREEN hedge (dabs kept inside the hedge body plane)
  {c:[-1.5,3.8,-9],r:[4.3,3.4,3.4],n:13000,g:[0.11,0.30,0.12], mid:[0.86,0.62,0.16], late:[0.72,0.40,0.14], tree:1, apple:1, at:0.28}, // APPLE — russet, bigger
  {c:[-6.3,2.9,-9.5],r:[2.5,2.3,1.9],n:4500,g:[0.50,0.60,0.12], mid:[0.95,0.52,0.10], late:[0.86,0.13,0.06], maple:1, tree:1, at:0.60}, // MAPLE — SCARLET, latest
  {c:[6.4,3.2,-9.5],r:[2.6,2.3,2.2],n:4000, g:[0.13,0.31,0.12], mid:[0.82,0.46,0.14], late:[0.70,0.26,0.12], tree:1, cherry:1, at:0.32}, // CHERRY — warm red
  {c:[3.3,1.35,-6],r:[1.4,1.3,1.2],n:1800, g:[0.07,0.20,0.10], mid:[0.07,0.20,0.10], late:[0.07,0.20,0.10], ever:1}, // EVERGREEN box
  {c:[-3.5,1.25,-5.5],r:[1.2,1.1,1.0],n:1500,g:[0.06,0.18,0.09], mid:[0.06,0.18,0.09], late:[0.06,0.18,0.09], ever:1}, // EVERGREEN box
  {c:[7.8,1.5,-5], r:[2.0,1.6,1.4],n:1700, g:[0.16,0.36,0.13], mid:[0.85,0.6,0.12], late:[0.6,0.3,0.1], bloss:1, at:0.2},
  {c:[-8.6,1.4,-5],r:[1.9,1.5,1.3],n:1600, g:[0.14,0.33,0.12], mid:[0.85,0.6,0.12], late:[0.6,0.3,0.1], bloss:1, at:0.5},
];
const LC=[]; const BR=[]; const LSTR=19;
// leaf shape per mass: 0 round · 1 oval · 2 maple · 3 lobed (oak-ish)
MASSES.forEach((m,mi)=>{ m._lf = m.maple?2 : ((m.cherry||m.apple)?1 : (m.tree ? (mi%2?3:0) : 1)); });
function pushLeaf(x,y,z,size,g,mid,late,turn,bloss,shade,lf,ever){
  LC.push(x,y,z,size,R(), g[0]*(0.7+0.6*R()),g[1]*(0.75+0.5*R()),g[2]*(0.7+0.6*R()),
          mid[0],mid[1],mid[2], late[0],late[1],late[2], turn,bloss,shade,lf,ever);
}
function seg(p0,p1,w0,w1,c){ BR.push(p0.x,p0.y,p0.z, p1.x,p1.y,p1.z, w0,w1, c[0],c[1],c[2]); }
const V=THREE.Vector3;
function leafAt(x,y,z,m){
  const yy=Math.max(0.2,y);
  const hN=THREE.MathUtils.clamp((yy-(m.c[1]-m.r[1]))/(2*m.r[1]),0,1);
  const size=THREE.MathUtils.lerp(0.22,0.5,R())*(m.maple?0.85:1.0);
  let lf=m._lf; if(!m.maple && !m.cherry && !m.apple && R()<0.12) lf=[0,1,3][R()*3|0];
  const bl=m.apple?3:(m.cherry?2:(m.bloss?1:0));
  const turn=m.ever?0.0:Math.min(0.98,(m.at||0.0)+R()*0.28);     // per-tree timing + per-leaf stagger
  pushLeaf(x,yy,z,size,m.g,m.mid,m.late,turn,bl,0.6+0.5*hN,lf,m.ever?1:0);
}
// a tree: trunk → many limbs → deep recursive branching; LEAVES tuft on the outer twigs
function branchRec(p,dir,len,w,depth,m,per,cr){
  const p1=p.clone().addScaledVector(dir,len);
  seg(p,p1,w,w*0.7,[0.20+0.10*R(),0.13+0.06*R(),0.07+0.04*R()]);
  if(depth<=2){ for(let k=0;k<per;k++) leafAt(p1.x+gauss()*cr, p1.y+gauss()*cr*0.8, p1.z+gauss()*cr*0.8, m); } // leaves over the outer 3 twig levels → full
  if(depth<=0) return;
  const k=2+(R()<0.5?1:0);
  for(let i=0;i<k;i++){
    const nd=dir.clone();
    nd.x+=(R()*2-1)*0.6; nd.z+=(R()*2-1)*0.6; nd.y+=(R()-0.45)*0.4; nd.normalize();
    branchRec(p1,nd,len*0.74,w*0.66,depth-1,m,per,cr);
  }
}
function growTree(m,mn){
  const base=new V(m.c[0],0,m.c[2]);
  const top=new V(m.c[0]+gauss()*0.2, Math.max(0.6,m.c[1]-m.r[1]*0.5), m.c[2]+gauss()*0.2);
  const tw=Math.max(0.11,m.r[0]*0.045);
  seg(base,top,tw,tw*0.82,[0.22,0.14,0.08]);                  // trunk
  const mains=5+(R()*4|0), per=Math.max(3,(mn/(mains*150))|0), cr=Math.max(0.3,m.r[0]*0.15);
  for(let b=0;b<mains;b++){
    const ang=(b/mains)*6.2831+R()*1.0;
    const dir=new V(Math.cos(ang)*0.7, 0.6+R()*0.4, Math.sin(ang)*0.7).normalize();
    branchRec(top,dir, m.r[0]*0.34, tw*0.72, 5, m, per, cr);   // depth 5 = lots of twigs
  }
}
// the apple tree: short gnarled trunk + spreading scaffold limbs (visible), then a
// DENSE crown of leaves that covers its front; fruit hung through the lower crown
const FR2=[];   // apples: x,y,z,size,seed
function growApple(m,mn){
  const base=new V(m.c[0],0,m.c[2]);
  const trunkTop=new V(m.c[0]+gauss()*0.12, 1.6+R()*0.3, m.c[2]+gauss()*0.12);
  seg(base,trunkTop, m.r[0]*0.085, m.r[0]*0.07,[0.24,0.15,0.08]);    // short, thick trunk
  const mains=5+(R()*2|0);
  for(let b=0;b<mains;b++){
    const ang=(b/mains)*6.2831+R()*0.7;
    const dir=new V(Math.cos(ang)*0.85, 0.5+R()*0.3, Math.sin(ang)*0.85).normalize();
    // a gnarled scaffold limb with a couple of kinks
    let p=trunkTop.clone(), d=dir.clone(), w=m.r[0]*0.05;
    for(let s=0;s<3;s++){
      const np=p.clone().addScaledVector(d, m.r[0]*0.32);
      seg(p,np,w,w*0.7,[0.22,0.14,0.08]); p=np; w*=0.7;
      d=d.clone(); d.x+=(R()*2-1)*0.5; d.y+=(R()-0.5)*0.4; d.z+=(R()*2-1)*0.5; d.normalize();
    }
  }
  // dense crown (covers the front) — gaussian fill, slightly flattened
  for(let i=0;i<mn;i++){
    leafAt(m.c[0]+gauss()*m.r[0], m.c[1]+gauss()*m.r[1]*0.95, m.c[2]+gauss()*m.r[2], m);
  }
  // apples hung through the lower-front of the crown, where they read
  const nApp=Math.max(12,(75*Q)|0);
  for(let i=0;i<nApp;i++){
    FR2.push(m.c[0]+gauss()*m.r[0]*0.8, m.c[1]-0.5+gauss()*m.r[1]*0.6, m.c[2]+Math.abs(gauss())*m.r[2]*0.65, 0.15+R()*0.10, R(), 0);
  }
  // windfall — fallen apples lying on the grass under the tree (late autumn)
  const nFall=Math.max(6,(20*Q)|0);
  for(let i=0;i<nFall;i++){
    FR2.push(m.c[0]+gauss()*m.r[0]*0.9, 0.06, m.c[2]+0.8+Math.abs(gauss())*m.r[2]*0.8, 0.13+R()*0.07, R(), 1);

const SEASONS=[{n:'winter',t:0},{n:'spring',t:80},{n:'summer',t:172},{n:'autumn',t:264},{n:'winter',t:340}];

function smooth(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);}

  [150,'in full leaf'],[185,'high summer · the garden hums'],[250,'first turn'],[285,'golds deepen'],
  [305,'leaf fall'],[322,'the maple blazes'],[340,'bare again']];

  const g=growthOf(day), tm=t*0.001;
  _r.setFromMatrixColumn(cam.matrixWorld,0); _u.setFromMatrixColumn(cam.matrixWorld,1);
  leafMat.uniforms.camRight.value.copy(_r); leafMat.uniforms.camUp.value.copy(_u);
  leafMat.uniforms.day.value=day; leafMat.uniforms.time.value=tm;
  const rr=_r.clone(); rr.y=0; rr.normalize();
  floorMat.uniforms.camRight.value.copy(rr); floorMat.uniforms.day.value=day;
  floorMat.uniforms.growth.value=Math.max(0.12,g); floorMat.uniforms.time.value=tm;
  florMat.uniforms.camRight.value.copy(_r); florMat.uniforms.camUp.value.copy(_u);
  florMat.uniforms.day.value=day; florMat.uniforms.time.value=tm;
  grassMat.uniforms.camRight.value.copy(rr); grassMat.uniforms.time.value=tm;
  birdMat.uniforms.camRight.value.copy(_r); birdMat.uniforms.camUp.value.copy(_u); birdMat.uniforms.time.value=tm;
  fruitMat.uniforms.camRight.value.copy(_r); fruitMat.uniforms.camUp.value.copy(_u); fruitMat.uniforms.day.value=day;
  const sun=(window.__sun!=null)?window.__sun:0.69+0.31*Math.sin(tm*0.085); // slow day → golden dusk drift (never below 0.38 — no darkness; full night still reachable via __sun for film)
  postU.sun.value=sun; lightMat.uniforms.sun.value=sun; lightMat.uniforms.time.value=tm;
  const nightAmt=1.0-smooth(0.10,0.30,sun);
  starMat.uniforms.night.value=nightAmt; starMat.uniforms.time.value=tm; moonMat.uniforms.night.value=nightAmt;
  water.material.uniforms.time.value=tm;
  groundU.time.value=tm;
  const leafOn=smooth(72,112,day)*(1-smooth(300,340,day));
  groundU.dap.value=0.2+0.6*leafOn; floorMat.uniforms.dap.value=0.2+0.6*leafOn;
  blossomFall.uniforms.time.value=tm; blossomFall.uniforms.amt.value=smooth(80,96,day)*(1-smooth(108,124,day));
  leafFall.uniforms.time.value=tm; leafFall.uniforms.amt.value=smooth(292,315,day)*(1-smooth(336,358,day));
  fliesMat.uniforms.time.value=tm; fliesMat.uniforms.amt.value=smooth(118,150,day)*(1-smooth(252,292,day))*(0.06+0.94*smooth(0.35,0.62,sun)); // pollinators head home at dusk
  renderer.setRenderTarget(sceneRT); renderer.render(scene,cam);
  postU.src.value=sceneRT.texture; postQuad.material=presentMat;
  renderer.setRenderTarget(null); renderer.render(post,postCam);
  document.getElementById('day').textContent=Math.floor(day);
  document.getElementById('year').textContent=year;
  document.getElementById('season').textContent=seasonName(day);
  document.getElementById('ev').textContent=currentEvent(day);
}
requestAnimationFrame(frame);
window.__setDay=v=>{day=v;}; window.__pause=v=>{paused=v;};
window.__dbg={strokes:FN, strokeCap:FMAX, florets:FL.length/FLSTR, floretsDrawn:FLN, leaves:NL};
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight);
  layout();
  postU.res.value.set(innerWidth,innerHeight);
  sceneRT.setSize(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio()); });
addEventListener('keydown',e=>{ if(e.code==='Space'){paused=!paused;e.preventDefault();}
  if(e.code==='ArrowUp')speed=Math.min(speed*1.3,90); if(e.code==='ArrowDown')speed=Math.max(speed/1.3,1); });
</script>
