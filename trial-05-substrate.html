<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GardenOS — Trial 05 · Ecological Substrate</title>
<style>
  html,body{margin:0;height:100%;background:#02030a;overflow:hidden;
    font-family:-apple-system,Inter,system-ui,sans-serif;color:#e8e4dc}
  canvas{display:block}
  #hud{position:fixed;left:20px;bottom:18px;z-index:10;font-size:12px;letter-spacing:.05em;
    line-height:1.55;text-shadow:0 1px 10px #000;opacity:.82;pointer-events:none}
  #season{font-size:11px;text-transform:uppercase;letter-spacing:.24em;opacity:.6}
  #dom{font-size:11px;opacity:.55;margin-top:2px}
  #title{position:fixed;right:20px;top:18px;z-index:10;text-align:right;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;opacity:.4;text-shadow:0 1px 10px #000}
  #hint{position:fixed;left:20px;top:18px;z-index:10;font-size:11px;letter-spacing:.06em;
    opacity:.3;text-shadow:0 1px 10px #000}
</style>
</head>
<body>
<div id="title">GardenOS · Trial 05<br><span style="opacity:.6">ecological substrate</span></div>
<div id="hint">space · pause   ·   ↑↓ · year speed   ·   click · seed spores   ·   R · reset</div>
<div id="hud"><div id="season">winter</div><div>day <b id="day">0</b> / 365 · year <b id="year">1</b></div><div id="dom"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ───────────────────────────────────────────────────────────────
   GardenOS — Trial 05 · Ecological Substrate  (Layer 2, for real)
   Density fields evolve on the GPU. Spatial Lotka–Volterra with a
   shared resource: diffusion + competition + seasonal growth windows.
   Nothing is keyframed — spread, competition fronts, succession and
   year-over-year change all EMERGE. The field IS the memory.
     state.r = species A (spring coloniser)   → warm colour field
     state.g = species B (summer structural)  → violet fronts (structure)
     state.b = species C (shade mass)          → cool subtractive mass
     state.a = R, shared resource / light
   ─────────────────────────────────────────────────────────────── */

const YEAR=365;
const SIM_H=288;                                   // sim grid height; width = aspect
let SIM_W=Math.round(SIM_H*innerWidth/innerHeight);
const SUBSTEPS=6;                                  // sim steps per displayed frame
let day=0, year=1, speed=10, paused=false, seedNonce=1;

// ── three plumbing ────────────────────────────────────────────────
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
if(!renderer.capabilities.isWebGL2){document.body.innerHTML='<p style="color:#e88;font:14px sans-serif;padding:40px">WebGL2 required.</p>';}
const scene=new THREE.Scene(), cam=new THREE.Camera(), quad=new THREE.PlaneGeometry(2,2);
const mesh=new THREE.Mesh(quad,null); scene.add(mesh);

function simRT(){
  const rt=new THREE.WebGLRenderTarget(SIM_W,SIM_H,{
    type:THREE.HalfFloatType, format:THREE.RGBAFormat,
    minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter,
    wrapS:THREE.RepeatWrapping, wrapT:THREE.RepeatWrapping, depthBuffer:false});
  return rt;
}
let simA=simRT(), simB=simRT();
const sceneRT=new THREE.WebGLRenderTarget(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio(),
  {type:THREE.HalfFloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});

// ── INIT pass: resource full, scattered spores via hash ────────────
const initMat=new THREE.ShaderMaterial({
  uniforms:{nonce:{value:1.0}},
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.);}`,
  fragmentShader:`
    precision highp float; varying vec2 vUv; uniform float nonce;
    float h21(vec2 p){p=fract(p*vec2(123.34,456.21)+nonce);p+=dot(p,p+45.32);return fract(p.x*p.y);}
    float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
      float a=h21(i),b=h21(i+vec2(1,0)),c=h21(i+vec2(0,1)),d=h21(i+vec2(1,1));
      return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
    float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p*=2.0;a*=.5;}return s;}
    void main(){
      // smooth low-amplitude patches → diffusion smooths instead of cratering isolated spikes
      vec3 u;
      u.r=smoothstep(0.52,0.78, fbm(vUv*vec2(4.0,2.3)+5.0))      *0.55;  // spring patches
      u.g=smoothstep(0.56,0.82, fbm(vUv*vec2(5.0,3.0)+vec2(40.,11.)))*0.55; // summer patches
      u.b=smoothstep(0.54,0.80, fbm(vUv*vec2(3.0,1.8)+vec2(15.,31.)))*0.50; // shade patches
      gl_FragColor=vec4(u,1.0);                                    // R(resource)=1
    }`
});

// ── SEED pass: add spores onto existing state (click) ──────────────
const seedMat=new THREE.ShaderMaterial({
  uniforms:{state:{value:null},nonce:{value:1.0}},
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.);}`,
  fragmentShader:`
    precision highp float; varying vec2 vUv; uniform sampler2D state; uniform float nonce;
    float hash(vec2 p){p=fract(p*vec2(123.34,456.21)+nonce);p+=dot(p,p+45.32);return fract(p.x*p.y);}
    void main(){
      vec4 s=texture2D(state,vUv);
      if(hash(vUv*91.7)     <0.006) s.r=max(s.r,0.9);
      if(hash(vUv*53.3+3.0) <0.006) s.g=max(s.g,0.9);
      if(hash(vUv*77.1+9.0) <0.004) s.b=max(s.b,0.9);
      gl_FragColor=s;
    }`
});

// ── SIM pass: spatial Lotka–Volterra + diffusion + seasonal growth ──
const simMat=new THREE.ShaderMaterial({
  uniforms:{
    state:{value:null}, texel:{value:new THREE.Vector2(1/SIM_W,1/SIM_H)},
    day:{value:0}, dt:{value:1.0}, seedPhase:{value:0.0}
  },
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.);}`,
  fragmentShader:`
    precision highp float; varying vec2 vUv;
    uniform sampler2D state; uniform vec2 texel; uniform float day, dt, seedPhase;

    // per-species rates, expressed PER DAY (dt below is in days) ──────
    const vec3 D = vec3(0.26, 0.22, 0.17);      // diffusion (lower ⇒ doesn't smooth to uniform)
    const vec3 M = vec3(0.018,0.018,0.014);     // baseline death / day
    const vec3 MD= vec3(0.075,0.075,0.060);     // DORMANT death — out-of-season die-back clears the canvas
    const vec3 Rr= vec3(1.05, 1.00, 0.78);      // growth / day in-season
    const vec3 SD= vec3(0.030,0.030,0.024);     // seed-rain rate (patchy re-establishment)
    const vec3 WS= vec3(20.0, 110.0, 70.0);     // season window start
    const vec3 WE= vec3(150.0,240.0,330.0);     // season window end
    const float DR=0.40, INFLOW=0.16, CONSUME=0.42;

    vec4 samp(vec2 o){return texture2D(state, vUv+o);}
    vec4 lap(){
      vec2 tx=vec2(texel.x,0.), ty=vec2(0.,texel.y), td=texel;
      vec4 o = (samp(tx)+samp(-tx)+samp(ty)+samp(-ty))*0.2
             + (samp(td)+samp(-td)+samp(vec2(td.x,-td.y))+samp(vec2(-td.x,td.y)))*0.05;
      return o - samp(vec2(0.0));
    }
    vec3 niche(float d){
      vec3 g;
      for(int i=0;i<3;i++){ float s=WS[i],e=WE[i];
        g[i]=smoothstep(s,s+22.0,d)*(1.0-smoothstep(e-22.0,e,d)); }
      return g;
    }
    // patchy spore field, drifting slowly year-on-year via seedPhase ⇒ novel patterns
    float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
    float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
      float a=h21(i),b=h21(i+vec2(1,0)),c=h21(i+vec2(0,1)),d=h21(i+vec2(1,1));
      return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
    float spore(vec2 uv,float k,vec2 off){
      float n=vnoise(uv*k+off+vec2(seedPhase*0.7,seedPhase*0.4));
      return smoothstep(0.62,0.9,n);
    }

    void main(){
      vec4 s=texture2D(state,vUv);
      vec3 u=s.rgb; float R=s.a;
      vec4 l=lap();
      float occ=u.r+u.g+u.b;                       // total occupancy
      vec3 nv=niche(day);
      vec3 r=Rr*nv;
      vec3 growth=r*u*R*max(0.0, 1.0-occ);          // shared carrying capacity ⇒ competition
      vec3 seedRain=SD*nv*R*vec3(                    // re-establish from patchy spore rain, in-season only
        spore(vUv,vec2(4.0,2.3).x,vec2(5.0)),
        spore(vUv,5.0,vec2(40.,11.)),
        spore(vUv,3.0,vec2(15.,31.)));
      vec3 death =(M + MD*(1.0-nv))*u;              // hard die-back out of season ⇒ winter clears the canvas
      u += dt*(D*l.rgb + growth + seedRain - death);
      R += dt*(DR*l.a + INFLOW*(1.0-R) - CONSUME*(growth.r+growth.g+growth.b));
      u=clamp(u,0.0,1.0); R=clamp(R,0.0,1.0);
      gl_FragColor=vec4(u,R);
    }`
});

// ── RENDER pass: state → behaviour (field / front / mass) ──────────
const renderMat=new THREE.ShaderMaterial({
  uniforms:{ state:{value:null}, texel:{value:new THREE.Vector2(1/SIM_W,1/SIM_H)},
    ground:{value:new THREE.Vector3(.04,.05,.10)} },
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.);}`,
  fragmentShader:`
    precision highp float; varying vec2 vUv;
    uniform sampler2D state; uniform vec2 texel; uniform vec3 ground;

    void main(){
      vec4 s=texture2D(state,vUv);
      vec3 u=s.rgb; float R=s.a;

      // gradient magnitude of species B → competition FRONTS read as structure
      float gx=texture2D(state,vUv+vec2(texel.x,0.)).g - texture2D(state,vUv-vec2(texel.x,0.)).g;
      float gy=texture2D(state,vUv+vec2(0.,texel.y)).g - texture2D(state,vUv-vec2(0.,texel.y)).g;
      float frontB=clamp(length(vec2(gx,gy))*6.0,0.,1.1);

      vec3 warm = mix(vec3(.10,.32,.16), vec3(.96,.27,.30), smoothstep(0.0,0.7,u.r)); // tulip: green→red
      warm = mix(warm, vec3(1.0,.78,.28), smoothstep(0.5,1.0,u.r));                    // →gold at peak
      vec3 colA = warm * u.r * 1.5;
      vec3 colB = vec3(.62,.38,.95) * u.g * 0.9 + vec3(.78,.55,1.0)*frontB*u.g*1.4;    // allium body + bright fronts
      vec3 colC = vec3(.12,.30,.42) * u.b * 1.2;                                        // hosta cool mass

      // hosta is genuinely SUBTRACTIVE: removes warmth where shade dominates
      float shade = smoothstep(0.25,0.8,u.b);
      vec3 col = colA*(1.0-0.7*shade) + colB + colC;
      col += ground*0.02;
      col *= (0.55+0.45*R);                          // depleted ground reads darker

      gl_FragColor=vec4(col,1.0);
    }`
});

// ── PRESENT pass: threshold bloom + ACES (Step-04 rule, carried) ───
const presentMat=new THREE.ShaderMaterial({
  uniforms:{ src:{value:null}, res:{value:new THREE.Vector2(innerWidth,innerHeight)}, bloom:{value:0.6} },
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.);}`,
  fragmentShader:`
    precision highp float; varying vec2 vUv;
    uniform sampler2D src; uniform vec2 res; uniform float bloom;
    vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.);}
    void main(){
      vec3 base=texture2D(src,vUv).rgb;
      vec3 b=vec3(0.); float tot=0.;
      for(int i=1;i<=10;i++){
        float fr=float(i); float rad=fr*1.0/res.y; float w=1.0/(fr*fr);
        for(int k=0;k<8;k++){float a=float(k)/8.*6.2831;
          b+=texture2D(src,vUv+vec2(cos(a),sin(a))*rad).rgb*w; tot+=w;}
      }
      b/=tot; b=max(b-0.12,0.0)*1.25;                // bloom only the bright tail
      vec3 col=base + b*bloom;
      col=aces(col*1.05); col=pow(col,vec3(0.92));
      float v=smoothstep(1.25,0.25,length(vUv-0.5));
      gl_FragColor=vec4(col*v,1.0);
    }`
});

// ── helpers ───────────────────────────────────────────────────────
function blit(mat,target){ mesh.material=mat; renderer.setRenderTarget(target); renderer.render(scene,cam); }
function resetField(){ initMat.uniforms.nonce.value=seedNonce++; blit(initMat,simA); }
resetField();

// season ground tint
const SEASONS=[{n:'winter',t:0,c:[.04,.05,.10]},{n:'spring',t:80,c:[.05,.10,.08]},
  {n:'summer',t:172,c:[.09,.09,.05]},{n:'autumn',t:264,c:[.11,.06,.04]},{n:'winter',t:340,c:[.04,.05,.10]}];
function ground(d){for(let i=0;i<4;i++){const s=SEASONS[i],e=SEASONS[i+1];if(d>=s.t&&d<e.t){const t=(d-s.t)/(e.t-s.t);
  return[s.c[0]+(e.c[0]-s.c[0])*t,s.c[1]+(e.c[1]-s.c[1])*t,s.c[2]+(e.c[2]-s.c[2])*t];}}return SEASONS[4].c;}
function seasonName(d){for(let i=0;i<4;i++)if(d>=SEASONS[i].t&&d<SEASONS[i+1].t)return SEASONS[i].n;return'winter';}

// ── loop ──────────────────────────────────────────────────────────
let last=null, domTick=0;
function frame(t){
  requestAnimationFrame(frame);
  if(last===null)last=t; const dtr=Math.min((t-last)/1000,0.05); last=t;
  let dDay=0;
  if(!paused){ dDay=speed*dtr; day+=dDay; if(day>=YEAR){day-=YEAR; year++;} }

  // advance the ecology on the YEAR'S clock: dt is measured in DAYS, split
  // across substeps, clamped for diffusion stability. Pausing freezes the garden.
  const dtTotal=Math.min(dDay,1.2);
  if(dtTotal>0){
    simMat.uniforms.day.value=day;
    simMat.uniforms.dt.value=dtTotal/SUBSTEPS;
    simMat.uniforms.seedPhase.value=year+day/YEAR;   // spore patterns drift year-on-year
    for(let i=0;i<SUBSTEPS;i++){
      simMat.uniforms.state.value=simA.texture;
      blit(simMat,simB);
      const tmp=simA; simA=simB; simB=tmp;
    }
  }

  // interpret → scene buffer
  const g=ground(day); renderMat.uniforms.ground.value.set(g[0],g[1],g[2]);
  renderMat.uniforms.state.value=simA.texture;
  blit(renderMat,sceneRT);

  // present to screen
  presentMat.uniforms.src.value=sceneRT.texture;
  blit(presentMat,null);

  document.getElementById('day').textContent=Math.floor(day);
  document.getElementById('year').textContent=year;
  document.getElementById('season').textContent=seasonName(day);
  if((domTick++ %30)===0) updateDominance();
}
requestAnimationFrame(frame);

// read back a coarse sample to report which species dominates (every ~0.5s).
// half-float target → read Uint16 and decode.
const rb=new Uint16Array(4*64);
function h2f(h){const s=(h&0x8000)>>15,e=(h&0x7C00)>>10,f=h&0x03FF;
  if(e===0)return (s?-1:1)*Math.pow(2,-14)*(f/1024);
  if(e===31)return f?NaN:(s?-1:1)*Infinity;
  return (s?-1:1)*Math.pow(2,e-15)*(1+f/1024);}
function updateDominance(){
  try{
    renderer.readRenderTargetPixels(simA,Math.floor(SIM_W*0.5)-4,Math.floor(SIM_H*0.5)-4,8,8,rb);
    let a=0,b=0,c=0;for(let i=0;i<64;i++){a+=h2f(rb[i*4]);b+=h2f(rb[i*4+1]);c+=h2f(rb[i*4+2]);}
    const names=['spring field','summer structure','shade mass'];
    const vals=[a,b,c]; const m=Math.max(a,b,c);
    document.getElementById('dom').textContent = m<0.05?'— dormant —':('dominant: '+names[vals.indexOf(m)]);
  }catch(e){}
}

// ── controls ──────────────────────────────────────────────────────
addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  presentMat.uniforms.res.value.set(innerWidth,innerHeight);
  sceneRT.setSize(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio());
});
addEventListener('keydown',e=>{
  if(e.code==='Space'){paused=!paused;e.preventDefault();}
  if(e.code==='ArrowUp')speed=Math.min(speed*1.3,90);
  if(e.code==='ArrowDown')speed=Math.max(speed/1.3,1);
  if(e.key==='r'||e.key==='R'){day=0;year=1;resetField();}
});
addEventListener('click',()=>{ seedMat.uniforms.nonce.value=seedNonce++; seedMat.uniforms.state.value=simA.texture; blit(seedMat,simB); const tmp=simA;simA=simB;simB=tmp; });
</script>
</body>
</html>
